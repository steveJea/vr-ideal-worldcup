<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VR 이상형 월드컵</title>
  <meta name="description" content="VR 이상형 월드컵. 두 명 중 마음이 가는 쪽을 골라, 마지막에 남는 최애를 확인해 보세요.">
  <meta name="theme-color" content="#10080b">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="__ORIGIN__/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VR 이상형 월드컵">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="VR 이상형 월드컵">
  <meta property="og:description" content="두 명 중 마음이 가는 쪽을 골라, 마지막에 남는 최애를 확인해 보세요.">
  <meta property="og:url" content="__ORIGIN__/">
  <meta property="og:image" content="__ORIGIN__/img/teaser/og.jpg?v=3">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="임유리, VR 이상형 월드컵">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VR 이상형 월드컵">
  <meta name="twitter:description" content="두 명 중 마음이 가는 쪽을 골라, 마지막에 남는 최애를 확인해 보세요.">
  <meta name="twitter:image" content="__ORIGIN__/img/teaser/og.jpg?v=3">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=3">
  <link rel="preload" as="image" href="img/teaser/title.webp?v=3" type="image/webp">
</head>
<body>
  <section id="view-home" class="home">
    <div class="hero">
      <picture class="hero-photos">
        <source srcset="img/teaser/title.webp?v=3" type="image/webp">
        <img id="cover-a" alt="임유리" width="1080" height="1920" src="img/teaser/title.png?v=3">
      </picture>
      <header class="hero-bar">
        <span class="brand">VR</span>
        <button type="button" id="open-rank" class="ghost">전체 순위</button>
      </header>
    </div>
    <div class="home-panel">
      <div class="hero-copy">
        <p class="key-name">임유리</p>
        <p class="eyebrow">이상형 월드컵</p>
        <h1>마지막에 <br>남는 한 사람</h1>
        <p class="lead">마주 선 두 사람 가운데, 더 오래 보고 싶은 쪽을 고릅니다.</p>
      </div>
      <form id="setup" class="setup">
        <fieldset>
          <legend>누구를 만날까요</legend>
          <div class="segment" id="gender">
            <button type="button" data-gender="female" aria-pressed="true">여성</button>
            <button type="button" data-gender="male" aria-pressed="false">남성</button>
            <button type="button" data-gender="all" aria-pressed="false">모두</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>토너먼트 규모</legend>
          <div class="sizes" id="sizes">
            <button type="button" data-size="16" aria-pressed="true"><b>16</b><span>강</span></button>
            <button type="button" data-size="32" aria-pressed="false"><b>32</b><span>강</span></button>
            <button type="button" data-size="64" aria-pressed="false"><b>64</b><span>강</span></button>
          </div>
        </fieldset>
        <p id="roster-note" class="note">명단을 불러오는 중입니다.</p>
        <button id="start" class="cta" type="submit" disabled>명단을 불러오는 중</button>
      </form>
      <footer class="colophon">
        <section id="channels" hidden>
          <h2>공식 채널</h2>
          <div id="channel-list" class="channels"></div>
        </section>
        <p class="legal">엔터인코드</p>
      </footer>
    </div>
  </section>

  <section id="view-match" class="match" hidden>
    <header class="match-bar">
      <div class="match-top">
        <button type="button" id="quit" class="text-btn">나가기</button>
        <div class="round">
          <strong id="round-label">16강</strong>
          <span id="match-count">1 / 8</span>
        </div>
      </div>
      <div class="meter" aria-hidden="true"><span id="meter-bar"></span></div>
    </header>
    <button type="button" class="fighter" id="fighter-a"></button>
    <div class="vs" aria-hidden="true"><span>VS</span></div>
    <button type="button" class="fighter" id="fighter-b"></button>
  </section>

  <section id="view-result" class="result" hidden>
    <header class="subbar">
      <button type="button" id="result-home" class="text-btn">처음으로</button>
      <button type="button" id="result-rank" class="text-btn">전체 순위</button>
    </header>
    <p class="eyebrow">내 최애 히로인</p>
    <h1 id="winner-name"></h1>
    <ul id="winner-facts" class="facts"></ul>
    <figure class="poster">
      <img id="poster" alt="">
    </figure>
    <p id="rank-status" class="note"></p>
    <div class="action-grid">
      <button type="button" id="share-x">X에 올리기</button>
      <button type="button" id="copy-link">링크 복사</button>
      <button type="button" id="native-share">공유하기</button>
      <button type="button" id="share-kakao" hidden>카카오톡</button>
    </div>
    <button type="button" id="again" class="cta" type="button">다시 고르기</button>
  </section>

  <section id="view-rank" class="rank" hidden>
    <header class="subbar">
      <button type="button" id="rank-back" class="text-btn">뒤로</button>
      <h1>전체 순위</h1>
    </header>
    <p class="lead rank-lead">토너먼트에서 1위로 남은 횟수와, 전체 우승 가운데 비율입니다.</p>
    <p id="rank-total" class="note"></p>
    <ol id="rank-list" class="rank-list"></ol>
    <p id="rank-empty" class="note" hidden>아직 집계된 우승이 없습니다.</p>
    <p id="rank-error" class="note" hidden></p>
    <button type="button" id="rank-retry" hidden>다시 불러오기</button>
  </section>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <p id="sheet-title">이 사람으로 갈까요?</p>
      <img id="sheet-photo" alt="">
      <strong id="sheet-name"></strong>
      <div class="sheet-actions">
        <button type="button" id="sheet-cancel">다시 보기</button>
        <button type="button" id="sheet-ok">이 사람으로</button>
      </div>
    </div>
  </div>

  <div id="splash" class="splash" hidden>
    <p>ROUND</p>
    <strong id="splash-label"></strong>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js?v=3"></script>
  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
